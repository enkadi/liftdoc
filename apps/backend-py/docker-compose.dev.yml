# Standalone stack for running the backend on its own (Postgres + backend).
# In the full deployment the `backend` service below replaces the Spring Boot one in the
# repository's docker-compose.yml; see README.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: doclift
      POSTGRES_USER: doclift
      POSTGRES_PASSWORD: doclift
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doclift -d doclift"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      DB_URL: postgresql://doclift:doclift@db:5432/doclift
      APP_UPLOAD_DIRECTORY: /app/uploads
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  pgdata:
  uploads:
